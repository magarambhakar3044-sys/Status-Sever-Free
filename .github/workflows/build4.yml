name: Build APK 4
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build4.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
          echo "Building inside: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          printf "\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n" >> gradle.properties
          gradle assembleDebug -Pandroid.useAndroidX=true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StatusSaver-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
